services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MINI_APP_DOMAIN: ${MINI_APP_DOMAIN:-213-171-9-160.sslip.io}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      bot:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
